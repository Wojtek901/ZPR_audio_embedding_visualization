[package]
name = "ZPR_audio_embedding_visualization"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }

# --- Serializacja danych ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# --- ML ---
ort = "2.0.0-rc.15"
hf-hub = "1.0"
tokenizers = "0.23"
ndarray = "0.17"

# --- Dekodowanie i przetwarzanie sygnału audio ---
symphonia = { version = "0.6", features = ["all"] }
rubato = "5.1"
realfft = "3.5"

# --- Redukcja wymiarowości ---
manifolds-rs = "0.10"

# --- Obsługa błędów, identyfikatory i logowanie ---
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
